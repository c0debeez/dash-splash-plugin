[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dash-splash-plugin"
version = "0.1.0"
description = "A configurable full-screen startup loading overlay for Dash apps, packaged as a Dash Hooks plugin."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Ethan Zhang", email = "ethan.zhang2016@gmail.com" }]
keywords = ["dash", "plotly", "loading", "plugin"]
classifiers = [
	"Framework :: Dash",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
]
license = "MIT"
license-files = ["LICENSE", "src/dash_splash_plugin/resources/licenses/*"]
dependencies = ["dash>=4.5.0rc0", "typing-extensions>=4.11"]

[project.urls]
"Homepage" = "https://github.com/c0debeez/dash-splash-plugin"
"Bug Reports" = "https://github.com/c0debeez/dash-splash-plugin/issues"
"Source" = "https://github.com/c0debeez/dash-splash-plugin"


[dependency-groups]
dev = ["dash==4.5.0rc2"]
test = ["pytest>=8"]

[project.entry-points."dash_hooks"]
dash_splash_plugin = "dash_splash_plugin"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dash_splash_plugin = [
	"resources/splash.js",
	"resources/manifest.json",
	"resources/static-loaders.json",
	"resources/react/*.js",
	"resources/react/*.css",
	"resources/licenses/*",
	"py.typed",
]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]
